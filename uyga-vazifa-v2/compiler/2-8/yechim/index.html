<!DOCTYPE html>
<html>
<head>
  <title>Robotika to'garagi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="menu">
    <div class="logo">RoboKlub</div>
    <div class="links">
      <a href="#">Darslar</a>
      <a href="#">Musobaqa</a>

    </div>
  </nav>

  <header class="hero">
    <h1>Robot yasashni o'rganing</h1>
    <p>Har shanba, 12–16 yoshlilar uchun.</p>

  <section class="cards">
    <div class="card">
      <h3>Boshlang'ich</h3>
      <p>Sensor va motor bilan birinchi robot.</p>
      <button>Batafsil</button>
    </div>
    <div class="card">
      <h3>O'rta</h3>
      <p>Chiziq bo'ylab yuradigan robot.</p>
      <button>Batafsil</button>
    </div>
    <div class="card">
      <h3>Musobaqa</h3>
      <p>Sumo-robotlar jangi uchun tayyorgarlik.</p>
      <button>Batafsil</button>
    </div>
  </section>

  <footer class="footer">
    <p>RoboKlub · Toshkent · 2026</p>
  </footer>
</body>
</html>
