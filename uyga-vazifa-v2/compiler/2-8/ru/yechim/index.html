<!DOCTYPE html>
<html>
<head>
  <title>Кружок робототехники</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="menu">
    <div class="logo">RoboKlub</div>
    <div class="links">
      <a href="#">Уроки</a>
      <a href="#">Соревнования</a>
      <a href="#">Контакты</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Научитесь собирать роботов</h1>
    <p>Каждую субботу, для ребят 12–16 лет.</p>
  </header>

  <section class="cards">
    <div class="card">
      <h3>Начальный</h3>
      <p>Первый робот с датчиком и мотором.</p>
      <button>Подробнее</button>
    </div>
    <div class="card">
      <h3>Средний</h3>
      <p>Робот, который едет по линии.</p>
      <button>Подробнее</button>
    </div>
    <div class="card">
      <h3>Соревнования</h3>
      <p>Подготовка к битве сумо-роботов.</p>
      <button>Подробнее</button>
    </div>
  </section>

  <footer class="footer">
    <p>RoboKlub · Ташкент · 2026</p>
  </footer>
</body>
</html>
