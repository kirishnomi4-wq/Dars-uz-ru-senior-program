# dars-api testlari — faqat server/ o'zgarganda. Unit + integratsion (PostgreSQL 16 xizmat-konteyneri) + lint.
name: server-tests

on:
  push:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dars
          POSTGRES_PASSWORD: dars
          POSTGRES_DB: dars_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dars -d dars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://dars:dars@127.0.0.1:5433/dars_test
